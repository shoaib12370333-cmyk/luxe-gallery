<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Luxe Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Sora:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-body">
  <div class="login-card">
    <p class="wordmark" style="margin-bottom: 2rem;">Luxe<span>Gallery</span></p>
    <h1>Admin Login</h1>
    <form id="loginForm">
      <label>
        Username
        <input type="text" name="username" required autocomplete="username">
      </label>
      <label>
        Password
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <p class="error-msg" id="errorMsg"></p>
      <button type="submit">Log In</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const formData = new FormData(form);
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: formData.get('username'),
            password: formData.get('password')
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.error || 'Login failed. Please try again.';
          checkAdminStatus();
        }
      } catch (err) {
        errorMsg.textContent = 'Could not reach the server. Please try again.';
      }
    });

    // If login fails, quietly check whether an admin account exists at all —
    // this helps distinguish "wrong password" from "no admin account was ever
    // created" without needing server console access.
    async function checkAdminStatus() {
      try {
        const res = await fetch('/api/admin/status');
        const data = await res.json();
        if (data.adminAccountCount === 0) {
          errorMsg.textContent = 'No admin account exists on this server yet. See the README for recovery steps.';
        } else {
          errorMsg.textContent += ` (Account(s) on file: ${data.usernames.join(', ')})`;
        }
      } catch (err) {
        // Silently ignore — this is a best-effort diagnostic only.
      }
    }
  </script>
</body>
</html>
